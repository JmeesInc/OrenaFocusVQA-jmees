# expN04 — SEGMENT: **学習側にも入力構成の振り分けを入れる**
#
# ★狙い: temporal_grounding の律速は **学習時のフレーム間隔**。
#   119s クリップ（val p50）に対し
#     学習 16枚 → 間隔 7.44s  ／ 許容誤差 min(5, 1+長さ*4/360) = ±2.32s ＝ **3.2倍粗い**
#   実際 expN01 で悪化した 108 問の予測ズレ中央値が **7s ≒ 学習の間隔**だった。
#   → temporal 系だけ **32枚**にして間隔を 3.72s（半分）にする。
# ★推論では既に router で振り分けている（obj/temporal→64f@560 / 他→32f@768）。
#   **同じ規則を学習にも適用**する。振り分けは `submit/v005_segment_hybrid/router.py` に委譲。
# ★解像度はユーザ指示で上げ目に。object 系を **560** にして推論 config A と一致させる。
#   既存キャッシュ（448/560/768）から読み込み時縮小で供給できるので**新規抽出は不要**
#   （実測: temporal 90,260枚 / object 110,390枚 とも未抽出 0）。
# ★外部 OOD はこの run には **入れない**（v012 の LB 結果を待って判断）。対照を綺麗に保つ。

experiment:
  name: expN04_seg_framerouter
  seed: 42
  out_root: workspace/expN04_seg_framerouter

data:
  fold: 0
  # ★★fold0 val も学習に入れる（ユーザ判断 2026-09-03）。**CV は測れなくなり判定は LB のみ**
  train_part: all
  # ★anchor: 質問文中の hh:mm:ss のフレームを必ず含める。**推論は常に --anchor なのに
  #   学習は expE06g/expN01 とも未指定＝一度も使っていなかった**（入力分布のミスマッチ）。
  #   SEGMENT の 16.3% が時刻を含み temporal に直結するので、ここで揃える。コスト増なし。
  tracks:
    - {track: FRAME,   n_frames: 1,  size: 448, limit: null}
    # temporal 系: 枚数を倍にして時間解像度を上げる（間隔 7.44s → 3.72s）
    - {track: SEGMENT, n_frames: 32, size: 448, limit: null, anchor: true,
       router_groups: [TEMPORAL_GROUNDING]}
    # それ以外: 解像度を上げて推論 config A（64f@560）と揃える
    - {track: SEGMENT, n_frames: 16, size: 560, limit: null, anchor: true,
       router_groups: [OBJECT_RECOGNITION, AGGREGATION, EVENT_UNDERSTANDING, COMPLEX_REASONING]}
  pseudo:
    parquets:
      - workspace/expK00_pseudo_vqa/out/pseudo_segment_v1_packed.parquet
      - workspace/expK00_pseudo_vqa/out/pseudo_frame_v1_packed.parquet
      - workspace/expK00_pseudo_vqa/out/pseudo_frame_cutpaste_v1_packed.parquet
    frames_root: workspace/expK00_pseudo_vqa/out/packed
    size: 448
    paraphrase_prob: 0.5
    limit: null
    format_mix:
      FRAME:
        fo_class: 0.46
        number: 0.31
        open_ended: 0.10
        binary: 0.09
        multiple_choice: 0.05
    track_limits:
      FRAME: 3854

model:
  id: Qwen/Qwen3.5-9B
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_double_quant: true
  compute_dtype: bfloat16
  # ★★`n=32` のサンプリングで決めてはいけない（尾を捉えられない）。
  #   2026-09-04: smoke の n=32 で max=5709 を見て 6144 にしたら、本走 step 24 で
  #   seq_len=6158 のサンプルに当たり「切り詰めで answer が全部落ちた」で停止した。
  #   n=500 で測り直した実測（SEGMENT 32枚@448 / 7,862問中 500件）:
  #     p50=4756  p95=5709  p99=6039  max=6158
  #   残り 7,362 件にさらに長い尾がある可能性を見て **実測 max の 1.33倍**を取る。
  #   VRAM 予測ピーク = 7.1GB + 8192*0.004 = 39.9GB（47.4GB 中）で余裕あり。
  max_seq_len: 8192

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [qkv, proj, linear_fc1, linear_fc2, q_proj, k_proj, v_proj, o_proj,
                   in_proj_qkv, in_proj_a, in_proj_b, in_proj_z, out_proj,
                   gate_proj, up_proj, down_proj]

train:
  # ★専有インスタンスなので ballast 不要（[[ddp-ranks-squat-on-gpu0]]）
  reserve_mb: 0
  min_reserve_mb: 0
  epochs: 1
  lr: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  grad_accum: 4          # ★DDP 4GPU: 1 x 4 x 4 = 16（単体 grad_accum 16 と同一有効バッチ）
  per_device_batch_size: 1
  lr_scheduler: cosine
  logging_steps: 10
  save_steps: 200
  # ★★train_part=all なので **held-out が無い**。eval_loss は学習データ上の値になり
  #   「best」は意味を持たない。expN01 では平坦なノイズの argmin（step600 = 24%地点）を
  #   拾って学習の 76% を捨てた（[[load-best-picks-noise-argmin]]）。
  #   → **eval を止め、最終 step を採用する**。
  eval_steps: 0
  eval_subset: 0
  save_total_limit: 3
  train_limit: null
  gradient_checkpointing: true
  keep_embed_lowp: true
  load_best_model_at_end: false
  dataloader_num_workers: 8   # ★768→560 の読み込み時縮小が CPU に乗るので増やす
