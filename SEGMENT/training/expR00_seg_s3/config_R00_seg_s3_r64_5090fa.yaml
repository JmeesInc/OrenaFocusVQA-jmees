# expR00 — SEGMENT ベスト構成を **expP00C の流儀**で作り直す
#
# ユーザ確定事項（2026-09-04）:
#   ①外部データを入れる（P00C 準拠）  ②学習の SEGMENT を **32f@448 + anchor** にする
#   ③`train_part: all`（fold0 val も学習に入れる。**CV は測れず判定は LB のみ**）
#   ④遊休の 4×RTX6000Ada（vast 49813999）で DDP
#
# ★本命施策: SEGMENT の**学習と推論のフレームの渡し方のズレ**を潰す。
#   これまで 学習 16枚・anchor なし / 推論 32〜64枚・anchor あり だった。
#   P00C が PROCEDURE でやった是正の SEGMENT 版。
#
# ★対照 = expN00 s1rules **SCORE 0.7065**（fold0 val 3,925問, judge込み）。
#   ただし本 run は train_part=all なので **同じ土俵では測れない**。判定は LB。
#
# ★入れないもの（すべて実測で負けている）:
#   - PROCEDURE: joint に混ぜると SEGMENT が大きく落ちる（expE03f 0.5674 < expE06g 0.6496）
#   - 擬似ラベル: joint で expK01S −0.0303 / expK03 −0.0317 と2連敗
#   - mask 塗り(s2): s1rules 0.7065 vs s2rules 0.6828（−0.0237）。32枚ぶんの塗りが場面を隠す
#   - 33枚以上: 96f 0.6958 < 64f 0.7113 < 32f 0.7197（同 token 予算）

experiment:
  name: expR00_seg_s3_r16_alldata_5090
  seed: 42
  # ★成果物を expR00 配下に出す（既定は trainer のある expM03 配下になってしまう）
  out_root: workspace/expR00_seg_s3

data:
  fold: 0
  qa_version: v004        # = fold v003
  # ★機体には元動画が無い（フレームキャッシュだけ）ので false。
  #   true だと欠けたフレームを ffmpeg で作ろうとして FileNotFoundError で落ちる。
  extract: false
  with_procedure: false   # ★推論時ヒントは学習に入れると符号が反転した実績（expI）
  # ★★fold0 val も学習に入れる（ユーザ判断 2026-09-04）。**CV は測れず判定は LB のみ**
  train_part: all

  # ★SEGMENT に anchor（問題文中の hh:mm:ss を必ず含める）。SEGMENT の 17.1% が該当。
  #   推論は常に --anchor なのに学習は expE06g/expN00/expN01 とも未指定だった。
  # ★実測（2026-09-04 dry-run）: 実効フレーム mean = train 30.57 / val 30.67
  #   （32 に満たないのは 1s 格子で短いクリップが 32 枚取れないため。**dropped 0**）
  tracks:
    - {track: FRAME,   n_frames: 1,  size: 448, limit: null}
    - {track: SEGMENT, n_frames: 32, size: 448, limit: null, anchor: true}
  # ★c2_env は書かない。combo2 を使わないので不要（持ち込むと新たなズレを作る）

  # ★★instseg 重畳 s3（bbox のみ・クラス色・conf・**番号なし**）。in-place 差し替えなので
  #   トークン数は増えない = latency/VRAM のコストがゼロ。
  #   `two_way: true` で **s0/s3 を 1/2 ずつ**（3スタイル 1/3 だと重畳ありの学習量が薄まる）。
  #   ⚠️CONTROL arm（検出器が注釈を学習した36動画）と検出0クリップは常に s0。
  #     空の重畳は expG00 §39 で −0.0429 の実害があるため付けない。
  #   キャッシュは cache_p00_448(s3 47,558枚) を種にして 32f+anchor の差分 30,770 枚を追加したもの。
  overlay3:
    cache_root: workspace/expR00_seg_s3/cache_r00_448
    arm_csv: workspace/expM00_frame_overlay/overlay_arm_v001.csv
    two_way: true
    val: true
    # ★smoke の attach3 実測で確定させる（attach3 は train_limit より前に全サンプルへ走る）
    expect_drawn: 11956

  external:
    parquets:
      - workspace/expM02_surgmllmbench/out/surgmllmbench_qa_v1.parquet
      - workspace/expM01_multibypass_qa/out/multibypass_qa_v1.parquet
      - workspace/expM04_round2_surgatlas/out/surgatlas_qa_v1.parquet
    size: 448
    loss_weight: 0.5        # FOCUS(1.0) より弱く＝事前学習的
    procedure_dropout: 0.5
    # ★track 比の教訓（K01S: FRAME 擬似だけ足して 1:1→1:1.76 に崩れ −0.0303）:
    #   外部は FRAME に偏っている（SMB+SurgAtlas+MB = 40,170）ので **FRAME を 8,000 に cap**。
    #   SEGMENT は MB 全量。→ F 28,000 / S 28,000 でほぼ 1:1 を保つ。
    track_limits:
      FRAME: 8000
      SEGMENT: null

model:
  id: Qwen/Qwen3.5-9B
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_double_quant: true
  compute_dtype: bfloat16
  # ★expN04 が n=500 で実測した 32f@448 の系列長: p50 4756 / p95 5709 / p99 6039 / max 6158。
  #   n=32 のサンプリングで決めると尾を外して「切り詰めで answer が全部落ちる」（2026-09-04 実害）。
  # ★★RTX5090(sm_120) では flash-attn の PyPI 版が **import は通るが実行時にクラッシュ**する
  #   （カーネルが sm_120 用に無い。別レーンが 2026-09-04 に実測）。
  #   `attn_implementation: auto` は sm_80+ で flash_attention_2 を選び、trainer の
  #   try/except は **ロード時例外しか拾わない**ので、走り出してから落ちる。
  #   → **sdpa を明示**する。これで「flash-attn 無しでも 32GB に載るか」を正直に測れる。
  attn_implementation: flash_attention_2
  max_seq_len: 8192

lora:
  # ★scratch（init_from_adapter なし）。
  # ★2026-09-04 ユーザ指示で r=64 → **r=16** に変更。alpha は repo の慣例どおり 2r=32
  #   （SEGMENT ベストの expN00 も P00C StageC も r16/α32。α を 128 のまま r を下げると
  #     スケール α/r が 2→8 になり実効 lr が 4 倍相当になってしまう）。
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - qkv
    - proj
    - linear_fc1
    - linear_fc2
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_a
    - in_proj_b
    - in_proj_z
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  # ★**専有機体ではバラストを取らない**（reserve は共有GPUで枠を奪われないための機能）。
  #   2026-09-04 実測: 42000 を取ったら VRAM 98.5% 張り付きで 33.96 s/it まで落ちた。
  reserve_mb: 0
  min_reserve_mb: 0
  # ★DDP の警告に従う。True だと毎イテレーション autograd グラフを余分に走査する。
  ddp_find_unused_parameters: false
  # ★expR00(2026-09-04): 長さでグループ化した sampler（訪問順だけ変える）。
  #   4x4090 実測で GPU util が 20〜30% の時間 0%（DDP ストラグラー: 系列長 p50 948 / max 6,197）。
  #   連続 index を同程度の長さに揃えて 4 rank を同時に終わらせる。データ・有効バッチ・lr・step は同一。
  group_by_length: true
  epochs: 1
  lr: 1.0e-4          # scratch なので継続学習(3e-5)より上げる
  warmup_ratio: 0.03
  weight_decay: 0.0
  # ★DDP 4GPU: 1(bs) x 4(accum) x 4(GPU) = **有効バッチ 16**（単体 grad_accum 16 と一致）。
  #   16 のままだと有効バッチ 64 になり step 数も LR スケールもズレる（根拠 chain_v07_ddp.sh）。
  # ★bs=2 は 48GB でも OOM（2026-09-04 実測）。系列長 p50 975 / max 5709 と 5.9倍ばらつき、
  #   左パディングで長い方に揃うため（[[batch-size-blocked-by-length-spread]]）。
  grad_accum: 4
  per_device_batch_size: 1
  lr_scheduler: cosine
  logging_steps: 10
  save_steps: 200
  # ★★train_part=all なので **held-out が無い**。eval_loss は学習データ上の値になり
  #   「best」は意味を持たない。expN01 では平坦なノイズの argmin（24%地点）を拾って
  #   学習の 76% を捨てた（[[load-best-picks-noise-argmin]]）。→ eval を止め最終 step を採る。
  eval_steps: 0
  eval_subset: 0
  # ★既定 2 だと中間 ckpt が消える（[[load-best-ships-the-32-percent-checkpoint]]）
  save_total_limit: 8
  train_limit: null
  gradient_checkpointing: true
  keep_embed_lowp: true
  load_best_model_at_end: false
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true
