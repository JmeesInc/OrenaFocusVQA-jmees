# expV09: Qwen3.8-27B で F+S joint を全量 1ep（借り GPU 48GB 専有）
#
# ## 何を測るのか
#   対照は **expE06g（Qwen3.5-9B / 同一データ・同一入力構成・同一 1ep）**。
#   差分は **モデルだけ**（と、大型に合わせた lr のみ）。
#     expE06g: SEGMENT 0.6958 / FRAME 0.6073（fold v003, N=1962/1958）
#
# ## 27B を今また試す理由（過去4連敗している）
#   FRAME で 9B に4連敗している（expD05 / D09 / D18 / D29）。ただし**全て Qwen3.6 世代・
#   fold v001・FRAME 単独**での敗北で、**Qwen3.8 世代でも SEGMENT でも未検証**。
#   Qwen3.8-27B は 2026-08-14 公開。**Qwen3.6-27B と param 数が完全一致
#   （27,781,427,952）・config も 64層/hidden 5120/intermediate 17408/vocab 248,320/
#   layer_types linear48+full16 まで同一**で、中身だけ学習し直したモデル。
#   → 過去の 27B 実測（VRAM・s/it）がそのまま使える。
#
# ## joint にする理由（FRAME 特化ではなく）
#   1回の学習で **FRAME と SEGMENT の両方の adapter が手に入る**（$19 で2トラック）。
#   ⚠️ FRAME 単体の最良は特化学習（expE10 0.6289 > expE03f joint 0.5681, p<0.001）なので、
#      **この run の主目的は SEGMENT 側**。FRAME は副産物として評価する。
#   ⚠️ PROCEDURE は入れない（expE06g vs expE03f で FRAME −0.039 と有害が確定済み）。

experiment:
  name: expV09_fs_38b_joint
  seed: 42

data:
  fold: 0
  qa_version: v004     # = fold v003。expE06g と同一
  extract: true        # (videoID,時刻) キーのキャッシュに全て存在するはずなので追加抽出はほぼ無い
  seg_aug: false       # ★expE06g と完全に同一条件にする（AUG は 1ep 71h で予算に入らないと実測済み）
  tracks:
    - {track: FRAME,   n_frames: 1,  size: 448, limit: null}   # 15,992 問
    - {track: SEGMENT, n_frames: 16, size: 448, limit: null}   # 15,994 問

model:
  id: Qwen/Qwen3.8-27B
  # ★2026-08-13 実測で **bf16 は 4bit より遅い**（重みのメモリ帯域が4倍）。4bit のまま。
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_double_quant: true
  compute_dtype: bfloat16
  # ★借り GPU は sm_89（RTX 6000 Ada / L40S）想定 → flash_attention_2 が自動選択される。
  #   ⚠️ 48GB でも sm_75（dl1 RTX8000）なら SDPA に落ちる。16f@448 = 2.9k token なら実害は無い。
  attn_implementation: auto
  # 16フレーム@448px の実測入力は約 2,900 token。answer が切れると静かに壊れるので余裕を持たせる。
  max_seq_len: 4096

lora:
  # ★27B は scratch。9B の adapter は形が違うので `init_from_adapter` は使えない。
  r: 16
  alpha: 32
  dropout: 0.05
  # vision + language 両方。★vision を外さないこと（FRAME で +0.34 を出した最大の梃子）
  target_modules: [qkv, proj, linear_fc1, linear_fc2, q_proj, k_proj, v_proj, o_proj,
                   in_proj_qkv, in_proj_a, in_proj_b, in_proj_z, out_proj,
                   gate_proj, up_proj, down_proj]

train:
  reserve_mb: 0        # 借り GPU は専有なので先取り確保しない
  epochs: 1
  # ★大型は 5e-5（expD18 の実績。expD29 の 2.5e-5 は 0.6152 → 0.5912 と悪化、1e-4 は過学習側）。
  #   9B の 1e-4 をそのまま持ち込まないこと。
  lr: 5.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.0
  grad_accum: 16
  per_device_batch_size: 1   # ★複数フレームでは 1 固定（VideoCollator が bs>1 を拒否する）
  lr_scheduler: cosine
  logging_steps: 10
  # ★eval は 300件を毎回まわす。27B では 1回あたり十数分かかるので **100 step ごとは高すぎる**
  #   （25回 ≒ 数時間 = 課金）。200 step 粒度で best 選択には十分。
  #   ⚠️ save_steps は eval_steps の整数倍にすること（load_best_model_at_end が best を拾えなくなる）。
  eval_steps: 200
  save_steps: 200
  eval_subset: 300
  save_total_limit: 4
  train_limit: null    # tracks 側で全量（31,986 サンプル / grad_accum 16 = 約 1,999 step）
  # ★★27B は VRAM が逼迫しているので **絶対に切らない**。
  #   （FRAME 1枚なら 9B で切れたが、SEGMENT 16枚は vision token が16倍で全層の活性化が乗る）
  gradient_checkpointing: true
  keep_embed_lowp: true   # ★必須。embed+lm_head 2.543B を fp32 に上げると +7.6GB
  load_best_model_at_end: true
  dataloader_num_workers: 8
