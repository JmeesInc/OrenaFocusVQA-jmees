experiment:
  name: expE02d_joint_all3
  seed: 42

data:
  fold: 0
  qa_version: v004
  extract: true        # キャッシュ済みなら何もしない
  # ★`tracks` を書くと **複数トラックを混ぜた joint 学習**になる（track/n_frames は無視）。
  #   FRAME は start_time == end_time なので自動的に1フレーム入力になる。
  #   ★コスト非対称: SEGMENT は 16 フレームで ~8 s/sample、FRAME は 1 フレームで ~1 s/sample。
  #     よって FRAME を多めに入れても学習時間はさほど増えない（下は約 3000*8 + 6000*1 = 30,000s/ep）。
  # ★3トラック同時学習。C(FRAME+SEGMENT, SCORE 0.5383) に PROCEDURE を足す。
  #   コストは frames にほぼ比例（実測 C: 3.6 s/sample 平均 = FRAME 1.2s / SEGMENT 8s）。
  #   PROCEDURE は 32 フレームなので ~16 s/sample。1500件で +6.7h（C の 9.3h → 約15h）。
  #   ★PROCEDURE の n_frames は **評価と揃える**こと（既存の PROCEDURE 評価は 32f@448）。
  #     time は 32f でも 128f でも原理的に届かない（到達可能性分析）ので、
  #     フレームを増やすより obj/agg のために枚数を確保する方が費用対効果が高い。
  tracks:
    - {track: FRAME,     n_frames: 1,  size: 448, limit: 6000}
    - {track: SEGMENT,   n_frames: 16, size: 448, limit: 3000}
    # ★32フレームは **backward で OOM**（実測 2026-08-06: 19.71GB 使用中に 4.45GB 要求、
    #   合計 24.2GB > 23.5GB）。断片化ではなく純粋な容量不足（未割当は 192MB のみ）。
    #   24フレームに落とすと系列長が 6,194 → 約4,650 tokens（25%減）で収まる見込み。
    #   ⚠️既存の PROCEDURE 評価は 32f なので、**D の評価と対照は 24f で取り直す**こと。
    # ★grid=1.0 でピン留め（2026-08-09、理由は config_F と同じ。既存 run の resume 用）
    - {track: PROCEDURE, n_frames: 16, size: 448, limit: 1500, grid: 1.0}

model:
  id: Qwen/Qwen3.5-9B
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_double_quant: true
  compute_dtype: bfloat16
  # ★トラックごとの実測入力トークン数（推論ログから）:
  #     FRAME 1f      : ~900
  #     SEGMENT 16f   : mean 2,829 / max 3,538
  #     PROCEDURE 32f : mean 4,894 / p99 6,148 / **max 6,194**
  #   **4096 のままだと PROCEDURE が切り詰められ、末尾の answer が消えて学習が壊れる**
  #   （collator が「学習対象トークン0個」で例外を出す）。max=6,194 + answer 分の余裕で 7168。
  #   ⚠️系列長が伸びる分だけ活性化メモリも増える。C(max 2,850)で 23.75/24GB だったので
  #     OOM の可能性がある → 本番前に smoke で必ず確認する（失敗したら PROCEDURE を 24f に落とす）。
  # ★24f も本番で OOM した（39分後、`cross_entropy` の logits で 4.48GB 要求）。
  #   OOM の主因は**活性化ではなく損失計算の logits テンソル**（seq_len × vocab 258k × 4byte）。
  #   16f なら SEGMENT(2,850 tokens) と同水準の 3,100 tokens に収まる。
  #   ※将来 `logits_to_keep`（モデルが対応済み）で logits を answer 付近だけに絞れば
  #     32f 以上も可能。ただし label の整合を間違えると静かに壊れるので要検証。
  max_seq_len: 4608

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # vision + language 両方。★vision を外さないこと（FRAME で +0.34 を出した最大の梃子）
  target_modules:
    - qkv            # vision attn
    - proj           # vision attn out
    - linear_fc1     # vision mlp
    - linear_fc2
    - q_proj         # language 全注意
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv    # language 線形注意
    - in_proj_a
    - in_proj_b
    - in_proj_z
    - out_proj
    - gate_proj      # language mlp
    - up_proj
    - down_proj

train:
  reserve_mb: 19000
  min_reserve_mb: 15000
  epochs: 1          # ★2ep=17.9h で一晩に入らない実測(57.4 s/it x 1126 step)。
                     #   同じ総サンプル数なら「少ないデータを2周」より「多いデータを1周」が有利なので
                     #   データ量は維持してエポックを落とす。勝ったアームだけ後で 2ep を試す。
  lr: 1.0e-4          # 9B の実績値（大型モデルは 5e-5 に半減が必要だった）
  warmup_ratio: 0.03
  weight_decay: 0.0
  grad_accum: 16
  per_device_batch_size: 1   # ★複数フレームでは 1 固定（VideoCollator が bs>1 を拒否する）
  lr_scheduler: cosine
  logging_steps: 10
  save_steps: 200
  eval_steps: 100
  eval_subset: 300
  train_limit: null   # tracks 側の limit で決まる
  gradient_checkpointing: true
  # peft の一律 fp32 アップキャストから embed/lm_head を除外する。
  # LoRA では凍結され更新されないので fp32 にする意味が無く、数GB 浮く。
  # 複数フレーム入力は活性化が大きいので、この余裕がそのままフレーム数の上限になる。
  keep_embed_lowp: true
  load_best_model_at_end: true
  dataloader_num_workers: 4
