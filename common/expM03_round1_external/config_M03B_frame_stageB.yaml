# expM03-B — Round 1 Stage B: Stage A の adapter から FOCUS+擬似のみで 1ep（アニーリング）
#
# Stage A との差分: external を外し、lora.init_from_adapter で warm start、epochs 1。
# それ以外（重畳・擬似・ハイパラ）は Stage A と同一。
# 変種 B'（外部を5-10%残す replay）を回す場合はこのファイルを複製して external を
# track_limits: {FRAME: 2000, SEGMENT: 0} で足す。

experiment:
  name: expM03B_frame_stageB
  seed: 42

data:
  track: FRAME
  fold: 0
  qa_version: v004
  n_frames: 1
  frame_size: 768
  extract: true

  overlay:
    cache_root: workspace/expM00_frame_overlay/cache
    variant: r1
    arm_csv: workspace/expM00_frame_overlay/overlay_arm_v001.csv
    t1: false
    val: true
    expect_dual: 7405

  pseudo:
    parquets:
      - workspace/expK00_pseudo_vqa/out/pseudo_frame_v2_packed.parquet
      - workspace/expK00_pseudo_vqa/out/pseudo_frame_cutpaste_v1_packed.parquet
    frames_root: workspace/expK00_pseudo_vqa/out/packed
    size: 768
    paraphrase_prob: 0.5
    limit: null

model:
  id: Qwen/Qwen3.5-9B
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_double_quant: true
  compute_dtype: bfloat16
  max_seq_len: 4096

lora:
  init_from_adapter: workspace/expM03_round1_external/results/expM03A_frame_stageA/fold0/adapter
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - qkv
    - proj
    - linear_fc1
    - linear_fc2
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_a
    - in_proj_b
    - in_proj_z
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  reserve_mb: 22000
  min_reserve_mb: 16000
  epochs: 1
  lr: 5.0e-5             # ★warm start の継続なので Stage A(1e-4) の半分から cosine で下げる
  warmup_ratio: 0.03
  weight_decay: 0.0
  grad_accum: 16
  per_device_batch_size: 1
  lr_scheduler: cosine
  logging_steps: 10
  save_steps: 200
  eval_steps: 100
  eval_subset: 300
  train_limit: null
  gradient_checkpointing: true
  keep_embed_lowp: true
  load_best_model_at_end: true
  dataloader_num_workers: 4
