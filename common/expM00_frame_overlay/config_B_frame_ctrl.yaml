# expM00-B — **A の対照**: A から `data.overlay` を落としただけ（重畳なし）
#
# ★A（`config_A_frame_overlay.yaml`）と**データ・ハイパラは完全に同一**。重畳だけが無い。
# ★さらに expK01F（0.6399, 擬似 v1+cutpaste・重畳なし）とも比べる。
#   B − K01F = 擬似 v1→v2 の差 / A − B = 重畳の差、と分解できる。
#
# データ（`build_arms.py` の集計）:
#   実 FRAME train 15,992 = DUAL 9,897（検出器が学習していない 68 動画）
#                          + CONTROL 6,095（検出器が学習した 36 動画 → 重畳を付けない）
#   擬似 15,906 = pseudo_frame_v2 11,433 + cutpaste 4,473（**全部 det-train 動画由来 → 重畳なし**）
#   合計 31,898 / 2ep / accum16 = 3,987 step
#
# ⚠️ **B は重畳を一切使わない**。DUAL/CONTROL の区別も無く、全問が原画像1枚。
#    評価は A と同じ CV（val 4,008・judge 込み）で matched に比べる。

experiment:
  name: expM00B_frame_ctrl
  seed: 42

data:
  track: FRAME
  fold: 0
  qa_version: v004
  n_frames: 1
  frame_size: 768
  extract: true

  # ★擬似 VQA: v2（104 動画すべてを覆う。うち 5,934 問が公式 QA を持たない unlabeled 68 本由来）
  #   + RARP cut-paste。**回答形式の構成比は実データとほぼ一致**（fo_class 41.9 / number 36.9 …）
  pseudo:
    parquets:
      - workspace/expK00_pseudo_vqa/out/pseudo_frame_v2_packed.parquet
      - workspace/expK00_pseudo_vqa/out/pseudo_frame_cutpaste_v1_packed.parquet
    frames_root: workspace/expK00_pseudo_vqa/out/packed
    size: 768
    paraphrase_prob: 0.5
    limit: null

model:
  id: Qwen/Qwen3.5-9B
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_double_quant: true
  compute_dtype: bfloat16
  # 1フレーム@768px は実測 約600〜900 token。
  max_seq_len: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - qkv
    - proj
    - linear_fc1
    - linear_fc2
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_a
    - in_proj_b
    - in_proj_z
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  reserve_mb: 22000
  min_reserve_mb: 16000
  epochs: 2
  lr: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  grad_accum: 16
  per_device_batch_size: 1
  lr_scheduler: cosine
  logging_steps: 10
  save_steps: 200
  eval_steps: 100
  eval_subset: 300
  train_limit: null
  gradient_checkpointing: true
  keep_embed_lowp: true
  load_best_model_at_end: true
  dataloader_num_workers: 4
