# expM00-E — **r4 描画**（クラス色 + 個体番号 + confidence）× 擬似 v2 の loss 重み調整
#
# ⚠️ A との差分は **2 因子**（描画 r1→r4 / 擬似 v2 の重み 1.0→0.6707）。
#    ユーザ判断で r4 を優先したため、どちらが効いたかは分離できない。
#    r4 は「検出器が持つ情報を落とさない」という設計上の是正なので、
#    分離より先に載せる方が期待値が高いという判断（2026-09-02）。
#
# ★根拠（val 3,928 / judge 込み / matched）:
#     expK01F（擬似 v1・重畳なし）  0.6423
#     expM00B（擬似 v2・重畳なし）  0.6259  ← **擬似 v1→v2 で −0.0164 (p=0.0092)**
#     expM00A（擬似 v2・重畳あり）  0.6488  ← 重畳で **+0.0229 (p=0.0003)**
#   A は「重畳の +0.023」で「擬似 v2 の −0.016」を埋めただけ。v2 の悪化が
#   **件数過多による寄与過大**なら、重みを 0.6707 に落とせば両方の利得が乗る。
# ★v1 に戻すのではなく重みで揃えるのは、v2 の網羅性を捨てないため（ユーザ判断）。
# ★実行は `expM03_round1_external/train_lora_ext.py`（WeightedTrainer を持つ）。
#   重み 1.0 だけの構成なら親クラス経路に落ちるので既存実験と数値一致する。
#
# ★対照は expM00-B（`config_B_frame_ctrl.yaml`）= **このファイルから `data.overlay` を
#   落としただけ**。差分は重畳の有無だけになる。
# ★さらに expK01F（0.6399, 擬似 v1+cutpaste・重畳なし）とも比べる。
#   B − K01F = 擬似 v1→v2 の差 / A − B = 重畳の差、と分解できる。
#
# データ（`build_arms.py` の集計）:
#   実 FRAME train 15,992 = DUAL 9,897（検出器が学習していない 68 動画）
#                          + CONTROL 6,095（検出器が学習した 36 動画 → 重畳を付けない）
#   擬似 15,906 = pseudo_frame_v2 11,433 + cutpaste 4,473（**全部 det-train 動画由来 → 重畳なし**）
#   合計 31,898 / 2ep / accum16 = 3,987 step
#
# ⚠️ 重畳画像は `render_cache.py` で**事前生成**したものを使う（学習と CV で同一画像）。
#    未生成のフレームがあると `overlay_attach.attach` が SystemExit で止まる（黙って進まない）。

experiment:
  name: expM00E_frame_overlay_psw
  seed: 42

data:
  track: FRAME
  fold: 0
  qa_version: v004
  n_frames: 1
  frame_size: 768
  extract: true

  # ★★instseg 重畳（expM00）
  overlay:
    cache_root: workspace/expM00_frame_overlay/cache_r4   # ★r4 描画 / conf 0.25
    # ⚠️**スクリーニング（control / r0 / r1 / r2 / r3 / t1）の勝者を入れること**。
    #   暫定で r1（クラス名は1番だけ + インスタンス番号）。
    variant: r4
    arm_csv: workspace/expM00_frame_overlay/overlay_arm_v001.csv
    t1: false
    val: true          # eval_loss 用の val にも同じ規則で付ける
    # ★しきい値 **conf 0.25**（ユーザ判断 2026-09-01）。
    #   スクリーニング（推論のみ）は 0.5 の方が僅かに上だったが（r1 +0.0061 vs +0.0045、
    #   直接対決 −0.0016 p=0.71 で同点圏）、**重畳を学習していないモデルでは
    #   「低信頼の印を割り引く」ことを学べない**ため、学習込みでは符号が変わりうる
    #   （[[infer-time-hint-can-flip-when-trained]] の実例あり）。
    #   ★レンダ後に実測: train 15,992 問 =
    #     dual **7,881** / 検出0件ゲート 2,016 / CONTROL arm 6,095 / 欠け 0
    #     （val 4,008 問 = dual 3,151 / ゲート 857）
    #   参考: conf 0.5 なら dual 7,405 / ゲート 2,492
    expect_dual: 7881

  # ★擬似 VQA: v2（104 動画すべてを覆う。うち 5,934 問が公式 QA を持たない unlabeled 68 本由来）
  #   + RARP cut-paste。**回答形式の構成比は実データとほぼ一致**（fo_class 41.9 / number 36.9 …）
  pseudo:
    parquets:
      # ★v2 は件数が v1 の 1.49 倍（11,433 vs 7,668）。**重みで v1 相当の寄与に揃える**
      #   （7,668 / 11,433 = 0.6707）。件数を削らないので v2 の網羅性
      #   （公式QAを持たない unlabeled 68本を含む 104 動画）はそのまま残る。
      - path: workspace/expK00_pseudo_vqa/out/pseudo_frame_v2_packed.parquet
        loss_weight: 0.6707
      # cutpaste は K01F / expM00B と同じ 1.0（両者で共通なので触らない）
      - workspace/expK00_pseudo_vqa/out/pseudo_frame_cutpaste_v1_packed.parquet
    frames_root: workspace/expK00_pseudo_vqa/out/packed
    size: 768
    paraphrase_prob: 0.5
    limit: null

model:
  id: Qwen/Qwen3.5-9B
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_double_quant: true
  compute_dtype: bfloat16
  # ★重畳ありは画像2枚 = 実測 約1,400〜2,000 token（1枚 600〜900）。4096 で足りる。
  max_seq_len: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - qkv
    - proj
    - linear_fc1
    - linear_fc2
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_a
    - in_proj_b
    - in_proj_z
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  reserve_mb: 22000
  min_reserve_mb: 16000
  epochs: 2
  lr: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  grad_accum: 16
  per_device_batch_size: 1
  lr_scheduler: cosine
  logging_steps: 10
  save_steps: 200
  eval_steps: 100
  eval_subset: 300
  train_limit: null
  gradient_checkpointing: true
  keep_embed_lowp: true
  load_best_model_at_end: true
  dataloader_num_workers: 4
